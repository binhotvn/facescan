# Runs the published image from GitHub Packages (GHCR).
#   docker compose up -d                     # latest
#   FACESCAN_TAG=1.2.0 docker compose up -d  # a specific release
#
# To build from this checkout instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  facescan:
    image: ghcr.io/binhotvn/facescan:${FACESCAN_TAG:-latest}
    pull_policy: always
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FACESCAN_PHOTOS: /app/photos
      FACESCAN_THUMBS: /app/data/thumbs
      FACESCAN_WARMUP: "1"
    volumes:
      - ./photos:/app/photos                   # event photos (uploads land here too)
      - ./data:/app/data                       # face index + thumbnail cache
      - insightface-models:/root/.insightface  # model cache; seeded from the image
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

volumes:
  insightface-models:
